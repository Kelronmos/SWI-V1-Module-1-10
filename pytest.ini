[pytest]
minversion = 7.0
testpaths = tests test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -v
    --tb=short
markers =
    unit: Fast unit tests
    contract: Contract and schema validation tests
    adversarial: Negative and hostile-input tests
    m00_m10: Boundary tests across Modules 00-10
