name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
      - name: Create runtime dirs
        run: mkdir -p logs .swi_temp
      - name: Run tests
        run: python -m pytest -q --cov=swi_core --cov-report=term --cov-report=xml
      - name: Documentation structure
        if: matrix.python-version == '3.12'
        run: python scripts/verify_docs.py
      - name: Claim language review
        if: matrix.python-version == '3.12'
        run: python scripts/check_claim_language.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
